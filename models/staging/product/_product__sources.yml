version: 2

sources:
  - name: product
    description: Raw product usage data landed from the Workato-style platform.
    database: product_usage
    schema: raw
    tables:
      - name: accounts
        description: One row per customer account.
      - name: account_plan_history
        description: Plan and MRR per account over time. valid_to is null for the current plan.
      - name: workspaces
        description: One row per workspace. Accounts can have several workspaces.
      - name: users
        description: One row per user. Each user belongs to one workspace.
      - name: recipes
        description: One row per recipe (an automated workflow).
      - name: recipe_connectors
        description: Connectors used by each recipe. Can contain duplicates.
      - name: recipe_jobs
        description: One row per recipe run. Can arrive late (see loaded_at).
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 7, period: day}
      - name: events
        description: Raw product events. Re-delivered events create duplicate event_ids.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 7, period: day}
      - name: subscriptions
        description: >
          Current plan per account, as the billing system stores it. Overwritten in place
          when a plan changes, and the row is deleted when an account churns. No history.